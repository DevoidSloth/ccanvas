<svg width="1200" height="20" viewBox="0 0 1200 20" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <!-- mid grey at low alpha so the hairline reads on GitHub's light and dark themes -->
    <linearGradient id="hair" gradientUnits="userSpaceOnUse" x1="0" y1="10" x2="1200" y2="10">
      <stop offset="0%" stop-color="#8a847c" stop-opacity="0"/>
      <stop offset="50%" stop-color="#8a847c" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#8a847c" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <line x1="0" y1="10" x2="1200" y2="10" stroke="url(#hair)" stroke-width="1"/>
  <circle cx="600" cy="10" r="2.5" fill="#d97757"/>
</svg>
