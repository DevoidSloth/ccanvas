<svg width="1200" height="360" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ccanvas — an infinite canvas for driving Claude Code">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#242320"/>
      <stop offset="70%" stop-color="#1a1918"/>
    </linearGradient>
    <linearGradient id="titleFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f3ded4"/>
      <stop offset="100%" stop-color="#e5906f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97757" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#d97757" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fade" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#ffffff" fill-opacity="0.08"/>
    </pattern>
    <mask id="dotMask">
      <rect width="1200" height="360" fill="url(#fade)"/>
    </mask>
    <linearGradient id="barFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d97757"/>
      <stop offset="100%" stop-color="#e5906f"/>
    </linearGradient>
    <style>
      @keyframes pulse { 0%,100% { opacity:.55 } 50% { opacity:1 } }
      @keyframes blink { 0%,45% { opacity:1 } 50%,95% { opacity:0 } 100% { opacity:1 } }
      @keyframes flow { to { stroke-dashoffset: -24; } }
      @keyframes flow2 { to { stroke-dashoffset: -24; } }
      @keyframes drift { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-4px); } }
      @keyframes glowPulse { 0%,100% { opacity:.7 } 50% { opacity:1 } }
      .glow { animation: glowPulse 4.5s ease-in-out infinite; transform-origin: 300px 150px; }
      .status-dot { animation: pulse 2.1s ease-in-out infinite; transform-origin: center; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      .flowline { stroke-dasharray: 5 5; animation: flow 1.6s linear infinite; }
      .flowline2 { stroke-dasharray: 5 5; animation: flow2 2.1s linear infinite; }
      .card { animation: drift 6.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .card.d2 { animation-delay: .8s; }
      .card.d3 { animation-delay: 1.6s; }
      text { font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1200" height="360" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="20" fill="url(#dots)" mask="url(#dotMask)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="358.5" rx="19.25" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <circle class="glow" cx="300" cy="150" r="230" fill="url(#glow)"/>

  <!-- title -->
  <text x="70" y="168" font-size="66" font-weight="700" letter-spacing="-2" fill="url(#titleFill)">ccanvas</text>
  <text x="72" y="205" font-size="19" fill="#b9b3ac">An infinite canvas for driving Claude Code</text>
  <text x="72" y="234" font-size="14.5" fill="#7c766f">Excalidraw, but the boxes are real terminals, agents, and live previews.</text>

  <!-- connecting arrows -->
  <path d="M 545 140 C 610 110, 650 95, 705 88" fill="none" stroke="#d97757" stroke-opacity="0.55" stroke-width="1.6" class="flowline"/>
  <path d="M 545 190 C 610 210, 655 225, 705 232" fill="none" stroke="#d97757" stroke-opacity="0.4" stroke-width="1.6" class="flowline2"/>
  <path d="M 545 165 C 640 168, 700 160, 740 160" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.4" stroke-dasharray="3 5"/>

  <!-- terminal card (outer group holds the fixed placement; CSS `transform`
       on an animated child would otherwise override an attribute transform
       on the *same* element, so the drift animation lives one level in) -->
  <g transform="translate(710,52)">
   <g class="card">
    <rect width="200" height="80" rx="9" fill="#252422" stroke="#ffffff" stroke-opacity="0.09"/>
    <rect width="200" height="22" rx="9" fill="#2b2a27"/>
    <rect width="200" height="12" y="10" fill="#2b2a27"/>
    <circle cx="14" cy="11" r="3.2" fill="#e5716b"/>
    <circle cx="26" cy="11" r="3.2" fill="#e0b155"/>
    <circle cx="38" cy="11" r="3.2" fill="#78b876"/>
    <text x="14" y="42" font-size="13" fill="#c9c3ba">$ claude</text>
    <rect x="14" y="52" width="7" height="13" fill="#d97757" class="cursor"/>
   </g>
  </g>

  <!-- agent card -->
  <g transform="translate(740,150)">
   <g class="card d2">
    <rect width="200" height="80" rx="9" fill="#252422" stroke="#ffffff" stroke-opacity="0.09"/>
    <circle class="status-dot" cx="18" cy="18" r="5" fill="#78b876"/>
    <text x="32" y="22" font-size="13" fill="#c9c3ba">agent</text>
    <text x="168" y="22" font-size="11" fill="#8a847c" text-anchor="end">42%</text>
    <rect x="14" y="34" width="172" height="6" rx="3" fill="#ffffff" fill-opacity="0.08"/>
    <rect x="14" y="34" width="72" height="6" rx="3" fill="url(#barFill)"/>
    <text x="14" y="62" font-size="11" fill="#7c766f">/widgets/VsCodeBody.tsx</text>
   </g>
  </g>

  <!-- editor card -->
  <g transform="translate(940,235)">
   <g class="card d3">
    <rect width="190" height="80" rx="9" fill="#252422" stroke="#ffffff" stroke-opacity="0.09"/>
    <circle cx="16" cy="16" r="4" fill="#7ea0c9"/>
    <text x="28" y="20" font-size="12" fill="#c9c3ba">editor</text>
    <rect x="14" y="32" width="100" height="5" rx="2.5" fill="#7ea0c9" fill-opacity="0.55"/>
    <rect x="14" y="44" width="150" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.14"/>
    <rect x="14" y="56" width="70" height="5" rx="2.5" fill="#d97757" fill-opacity="0.6"/>
   </g>
  </g>
</svg>
