name: Deploy web build to Vercel

# Publishes the browser build of ccanvas to Vercel production whenever a
# release tag is pushed — the same trigger as release.yml. (We can't listen
# for `release: published`: tauri-action creates the release with
# GITHUB_TOKEN, and events made by GITHUB_TOKEN don't start other workflows.)
#
#   • Push a tag  v*           → deploys that tag to production.
#   • Run manually (dispatch)  → deploys the tag you supply (e.g. v2.0.0).
#
# Git-push deploys are disconnected on the Vercel project, so production only
# ever changes here. Needs repo secrets VERCEL_TOKEN, VERCEL_ORG_ID and
# VERCEL_PROJECT_ID.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to deploy (e.g. v2.0.0)'
        required: true

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: Deploy ${{ github.event.inputs.tag || github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        # Monaco + hdf5 wasm chunks need more than Node's default heap.
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
