<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- ccanvas mark: two nested "c" patch cables on a graphite faceplate.
       The outer cable ends in a jack socket, the inner one in a lit LED. -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34332f"/>
      <stop offset="1" stop-color="#1c1b19"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e5906f" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#d97757" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#plate)" filter="url(#shadow)"/>
  <rect x="102" y="102" width="820" height="820" rx="184" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="4"/>

  <!-- registration marks -->
  <g stroke="#faf9f5" stroke-opacity="0.16" stroke-width="7" stroke-linecap="round">
    <path d="M244 226v36M226 244h36"/>
    <path d="M780 226v36M762 244h36"/>
    <path d="M244 762v36M226 780h36"/>
    <path d="M780 762v36M762 780h36"/>
  </g>

  <!-- outer c: silkscreen cable, jack socket at the top end -->
  <path d="M685.6 305.2 A270 270 0 1 0 685.6 718.8" fill="none" stroke="#faf9f5" stroke-width="60" stroke-linecap="round"/>
  <circle cx="685.6" cy="305.2" r="52" fill="#1f1e1d" stroke="#faf9f5" stroke-width="20"/>

  <!-- inner c: signal cable, LED at the bottom end -->
  <path d="M608.4 397.1 A150 150 0 1 0 608.4 626.9" fill="none" stroke="#d97757" stroke-width="60" stroke-linecap="round"/>
  <circle cx="608.4" cy="626.9" r="86" fill="url(#glow)"/>
  <circle cx="608.4" cy="626.9" r="22" fill="#fbe3d8"/>
</svg>
